name: CI/CD Pipeline - AWS EC2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          APP_ENV: test
          DEBUG: "True"
          UPLOAD_DIR: uploads
          MAX_FILE_SIZE_MB: 10
          DATABASE_URL: sqlite:///./test_jobs.db
          DEFAULT_GOOGLE_DOC_ID: 1Fv5GiS0iK3KJOQSHQB5gbASmaHEMZTUZo2TC_Fx14Hk
        run: |
          pytest -v

  deploy-ec2:
    name: Deploy to AWS EC2 (3.108.215.246)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check for EC2 SSH Secret
        id: check_secret
        run: |
          if [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "EC2_SSH_KEY secret not found in repository. Skipping automatic SSH deploy."
          fi

      - name: Deploy to EC2 via SSH
        if: steps.check_secret.outputs.has_secret == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "3.108.215.246"
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest code on EC2..."
            if [ -d "$HOME/CaptureBackend" ]; then
              cd "$HOME/CaptureBackend"
            elif [ -d "/var/www/CaptureBackend" ]; then
              cd "/var/www/CaptureBackend"
            fi
            git pull origin main
            if [ -f "venv/bin/activate" ]; then
              source venv/bin/activate
            fi
            pip install -r requirements.txt
            sudo systemctl restart capture-backend || sudo systemctl restart ocr-backend || true
            echo "Deployment completed on EC2."
